name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (mandatory)
        run: make

      - name: Build (bonus)
        run: make bonus

      - name: Verify archive contents
        run: |
          ar t libft.a | sort > members.txt
          test "$(wc -l < members.txt)" -eq 43

      - name: Unit tests (ASan + UBSan)
        run: make -C tests test

      - name: Clean
        run: make fclean

  norminette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install norminette
        run: python -m pip install norminette==3.3.60
      - name: Run norminette
        run: norminette src libft.h
